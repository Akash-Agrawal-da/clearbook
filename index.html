<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clearbook: bank statement analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M9 21V14M16 21V9M23 21V17" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/></svg>
      Clearbook
    </div>
    <nav class="tabs" aria-label="Main">
      <button class="tab" id="tabAnalyze" data-view="analyze">Analyze</button>
      <button class="tab" id="tabSaved" data-view="saved">Saved <span class="count"></span></button>
    </nav>
    <label class="muted" for="cur" style="font-size:14px">Currency</label>
    <select id="cur" class="cur">
      <option value="INR">₹ INR</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option>
    </select>
  </header>
  <main id="app"></main>
</div>
<input type="file" id="file" accept=".csv,.tsv,.txt,text/csv" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
